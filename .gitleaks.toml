[extend]
useDefault = true

[[allowlists]]
description = "Synthetic fixtures and verification probes"
paths = [
  '''(^|/)apps/backend-api/tests/''',
  '''(^|/)apps/backend-api/scripts/verify-live-confidentiality\.js$''',
  '''(^|/)apps/frontend-app/src/test/''',
]

[[allowlists]]
description = "Documented OCI environment-template placeholders only"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)infra/oracle/oci\.env\.example$''',
]
regexes = [
  '''^\s*[A-Z][A-Z0-9_]*\s*=\s*(?:REPLACE(?:_WITH)?[A-Z0-9_]*|https://YOUR_[A-Z0-9_]+\.compat\.objectstorage\.[a-z0-9-]+\.oci\.customer-oci\.com)\s*(?:#.*)?$''',
]

[[allowlists]]
description = "Public battery dictionary semantic model identifier"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)apps/backend-api/passport-modules/battery-v1/(manifest\.json|module\.js)$''',
]
regexes = [
  '''(?i)semanticModelKey["']?\s*[:=]\s*["']batteryDictionaryV1["']?''',
]
