name: Security And Smoke

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify secret-scan Git history is intact
        run: |
          set -euo pipefail

          git cat-file -e 'HEAD^{commit}'
          git fsck --full --no-dangling
          commit_count="$(git rev-list --count --all)"
          if ! [[ "$commit_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Refusing a secret scan with zero readable commits" >&2
            exit 1
          fi
          echo "Secret scan will inspect $commit_count committed revisions"
      - name: Scan committed history and current source for secrets
        run: |
          bash .github/scripts/run-gitleaks-fail-closed.sh \
            docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 256m \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              -v "$PWD:/repo:ro" \
              zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              detect --source=/repo --redact --no-color --no-banner \
              --config=/repo/.gitleaks.toml \
              --log-opts=--all

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Scan source for security defects
        # The generic traversal rule flags every guarded path construction; dedicated containment tests cover reviewed call sites.
        run: >-
          docker run --rm
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --pids-limit 256
          --memory 1024m
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m
          -e HOME=/tmp
          -e XDG_CACHE_HOME=/tmp/.cache
          -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD:/src:ro"
          -w /src
          returntocorp/semgrep@sha256:d3d1be3a3770514d16a6a57b9761575d7536d70f45a5220274f4ec7d55c442b9
          semgrep scan
          --config p/default
          --config p/secrets
          --config p/dockerfile
          --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
          --metrics=off
          --quiet
          --error

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend-api
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/backend-api/package-lock.json
      - name: Verify locked Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run check:style
      - run: npm run check:boundaries
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate

  repository-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository secret hygiene
        run: node scripts/check-repository-secrets.js
      - name: Check committed diff whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

  backend-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend-api
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/backend-api/package-lock.json
      - name: Verify locked Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - name: Build and start hardened PostgreSQL
        working-directory: ${{ github.workspace }}
        run: |
          docker build --pull=false -f infra/docker/postgres/Dockerfile -t dpp-postgres:ci .
          docker run -d --name dpp-ci-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=dppSystem \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-postgres-password-only-not-a-production-secret-1234567890 \
            dpp-postgres:ci
          for attempt in $(seq 1 30); do
            if docker exec dpp-ci-postgres pg_isready -U postgres -d dppSystem; then
              exit 0
            fi
            sleep 1
          done
          docker logs dpp-ci-postgres
          exit 1
      - name: Create ephemeral backend smoke secrets
        working-directory: ${{ github.workspace }}
        env:
          DPP_CI_ENV_DIR: ${{ runner.temp }}/dpp-env
        run: |
          umask 077
          install -d -m 700 "$DPP_CI_ENV_DIR"
          bash infra/oracle/generate-env-secrets.sh > "$DPP_CI_ENV_DIR/local-compose.env"
          chmod 600 "$DPP_CI_ENV_DIR/local-compose.env"
      - name: Boot backend and hit health endpoint
        env:
          DPP_ENV_FILE: ${{ runner.temp }}/dpp-env/local-compose.env
          NODE_ENV: development
          PORT: 3001
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: dppSystem
          DB_USER: postgres
          DB_PASSWORD: ci-postgres-password-only-not-a-production-secret-1234567890
          SERVER_URL: http://127.0.0.1:3001
          APP_URL: http://127.0.0.1:3000
          VITE_PUBLIC_VIEWER_URL: http://127.0.0.1:3004
          ALLOWED_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:3004,http://127.0.0.1:8080
          RUN_SCHEMA_MIGRATIONS: "true"
        run: |
          backend_pid=""
          cleanup() {
            if [ -n "$backend_pid" ]; then
              kill "$backend_pid" >/dev/null 2>&1 || true
              wait "$backend_pid" >/dev/null 2>&1 || true
            fi
            docker rm -f dpp-ci-postgres >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for startup_attempt in 1 2; do
            if ! docker exec dpp-ci-postgres psql -U postgres -d dppSystem -tAc 'SELECT 1' | grep -qx '1'; then
              echo "::error title=Backend smoke database::PostgreSQL did not accept a real query before backend startup."
              docker logs dpp-ci-postgres
              exit 1
            fi

            backend_log="/tmp/backend-smoke-${startup_attempt}.log"
            node src/server.js > "$backend_log" 2>&1 &
            backend_pid=$!
            for readiness_attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:3001/health; then
                exit 0
              fi
              if ! kill -0 "$backend_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            echo "Backend smoke startup attempt ${startup_attempt} did not become healthy."
            cat "$backend_log"
            kill "$backend_pid" >/dev/null 2>&1 || true
            wait "$backend_pid" >/dev/null 2>&1 || true
            backend_pid=""
            if [ "$startup_attempt" = "1" ]; then
              echo "::warning title=Backend smoke retry::Retrying once after a failed startup with the same verified database."
              sleep 2
            fi
          done
          echo "::error title=Backend smoke startup::The backend did not become healthy after two startup attempts."
          exit 1
      - name: Stop hardened PostgreSQL
        if: always()
        run: docker rm -f dpp-ci-postgres >/dev/null 2>&1 || true

  compose-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Create safe compose env for CI
        env:
          DPP_CI_ENV_DIR: ${{ runner.temp }}/dpp-env
        run: |
          umask 077
          install -d -m 700 "$DPP_CI_ENV_DIR"
          cat > "$DPP_CI_ENV_DIR/local-compose.env" <<'EOF'
          NODE_ENV=development
          DB_NAME=dppSystem
          DB_USER=postgres
          SERVER_URL=http://localhost:3001
          APP_URL=http://localhost:3000
          MARKETING_URL=http://localhost:8080
          VITE_PUBLIC_VIEWER_URL=http://localhost:3004
          ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3004,http://localhost:8080
          EOF
          bash infra/oracle/generate-env-secrets.sh >> "$DPP_CI_ENV_DIR/local-compose.env"
          cp infra/oracle/oci.env.example "$DPP_CI_ENV_DIR/oci.env"
          chmod 600 "$DPP_CI_ENV_DIR/local-compose.env" "$DPP_CI_ENV_DIR/oci.env"
          DPP_ENV_FILE="$DPP_CI_ENV_DIR/oci.env" \
          DPP_BACKEND_ENV_FILE="$DPP_CI_ENV_DIR/dpp-backend.env" \
            bash infra/oracle/prepare-backend-runtime-env.sh
      - run: DPP_ENV_FILE="$RUNNER_TEMP/dpp-env/local-compose.env" docker compose -f docker/docker-compose.yml --env-file "$RUNNER_TEMP/dpp-env/local-compose.env" config -q
      - run: DPP_ENV_FILE="$RUNNER_TEMP/dpp-env/oci.env" DPP_BACKEND_ENV_FILE="$RUNNER_TEMP/dpp-env/dpp-backend.env" docker compose -f docker/docker-compose.prod.yml --env-file "$RUNNER_TEMP/dpp-env/oci.env" config -q
      - run: DPP_ENV_FILE="$RUNNER_TEMP/dpp-env/oci.env" DPP_BACKEND_ENV_FILE="$RUNNER_TEMP/dpp-env/dpp-backend.env" docker compose -f docker/docker-compose.prod.backend.yml --env-file "$RUNNER_TEMP/dpp-env/oci.env" config -q
      - run: DPP_ENV_FILE="$RUNNER_TEMP/dpp-env/oci.env" docker compose -f infra/oracle/dpp-backup-compose.yml --env-file "$RUNNER_TEMP/dpp-env/oci.env" config -q
      - run: docker compose -f docker/docker-compose.prod.frontend.yml --env-file "$RUNNER_TEMP/dpp-env/oci.env" config -q
      - run: sh infra/oracle/check-edge-policy-config.sh

  ops-and-local-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/backend-api/package-lock.json
      - name: Verify locked Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Install locked backend dependencies for route security tests
        working-directory: apps/backend-api
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Check local generator syntax and mappings
        run: |
          node --check local-tools/passport-module-generator/server.js
          node --check local-tools/passport-module-generator/server/application.js
          node --check local-tools/passport-module-generator/server/http/transport.js
          node --check local-tools/passport-module-generator/client/workspace.js
          node --test local-tools/passport-module-generator/tests/*.node.test.js
          node --test apps/marketing-site/configure-runtime.node.test.js
      - name: Check deployment shell scripts
        run: |
          bash -n infra/oracle/check-edge-policy-config.sh
          bash -n infra/oracle/check-edge-tls.sh
          bash -n infra/oracle/check-live-edge.sh
          bash -n infra/oracle/check-marketing-public-content.sh
          bash -n infra/oracle/container-imds-firewall.sh
          bash -n infra/oracle/db-backup.sh
          bash -n infra/oracle/deploy-prod.sh
          bash -n infra/oracle/prepare-backend-runtime-env.sh
          bash -n infra/oracle/install-container-imds-firewall.sh
          bash -n infra/oracle/install-db-backup-jobs.sh
          bash -n infra/oracle/dpp-root-release-deployer.sh
          bash -n infra/oracle/install-root-release-deployer.sh
          bash -n scripts/deploy/bootstrap-actions-deployment-runner.sh
          bash -n scripts/deploy/check-deployment-runner.sh
          bash -n scripts/deploy/deploy-to-oci.sh
          bash -n scripts/deploy/install-deployment-runner-config.sh
          bash -n scripts/restart-local-stack.sh
          bash -n scripts/troubleshoot-oci.sh
      - name: Test deployment-runner preflight
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/dpp-ops-node-tests.log"
          if ! node --test --test-concurrency=1 \
            .github/scripts/run-gitleaks-fail-closed.node.test.js \
            .github/scripts/supply-chain-security.node.test.js \
            apps/backend-api/tests/company-logo-freshness.node.test.js \
            apps/backend-api/tests/host-only-cookie.node.test.js \
            apps/backend-api/tests/logger-redaction.node.test.js \
            apps/backend-api/tests/production-secret-config.node.test.js \
            apps/backend-api/tests/runtime-config.node.test.js \
            apps/backend-api/tests/runtime-database-role.node.test.js \
            infra/oracle/build-context-secrets.node.test.js \
            infra/oracle/container-imds-firewall.node.test.js \
            infra/oracle/db-backup.node.test.js \
            infra/oracle/deployment-runner-terraform.node.test.js \
            infra/oracle/object-storage-backups.node.test.js \
            infra/oracle/root-release-deployer.node.test.js \
            infra/docker/postgres/Dockerfile.node.test.js \
            scripts/deploy/check-deployment-runner.node.test.js \
            scripts/deploy/deploy-to-oci.node.test.js \
            scripts/deploy/production-deploy-workflow.node.test.js \
            2>&1 | tee "$test_log"; then
            failed_test="$(grep -m 1 -E '^(not ok|✖)' "$test_log" || true)"
            echo "::error title=Security test cohort::${failed_test:-Node security tests failed; inspect the protected workflow log.}"
            exit 1
          fi
      - name: Check deployment-runner Terraform formatting
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --pids-limit 64
          --memory 128m
          --tmpfs /tmp:rw,noexec,nosuid,size=32m
          -v "$PWD:/workspace:ro"
          -w /workspace/infra/oracle/terraform/deployment-runner
          hashicorp/terraform@sha256:f5ac787eee9d292b6a3b97d40f04019ce08189d356233fc73d5ec7ef8529cce2
          fmt -check
      - name: Check object-storage-backups Terraform formatting
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --pids-limit 64
          --memory 128m
          --tmpfs /tmp:rw,noexec,nosuid,size=32m
          -v "$PWD:/workspace:ro"
          -w /workspace/infra/oracle/terraform/object-storage-backups
          hashicorp/terraform@sha256:f5ac787eee9d292b6a3b97d40f04019ce08189d356233fc73d5ec7ef8529cce2
          fmt -check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/frontend-app
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/frontend-app/package-lock.json
      - name: Verify locked Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm test
      - run: npm run test:contrast
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  public-viewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/public-passport-viewer
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/public-passport-viewer/package-lock.json
      - name: Verify locked Node and npm toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  container-builds:
    runs-on: ubuntu-24.04
    # BuildKit caches are executable build input.  Untrusted pull requests get
    # their own scope and can never populate a cache consumed by main, schedule,
    # or manually dispatched trusted builds.
    env:
      DPP_BUILD_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, matrix.name) || format('trusted-{0}', matrix.name) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend-api/Dockerfile
            build_args: ""
          - name: frontend
            dockerfile: apps/frontend-app/Dockerfile
            build_args: |
              VITE_API_URL=https://api.example.test
              VITE_PUBLIC_VIEWER_URL=https://viewer.example.test
              VITE_MARKETING_URL=https://www.example.test
          - name: public-viewer
            dockerfile: apps/public-passport-viewer/Dockerfile
            build_args: |
              VITE_API_URL=https://api.example.test
              VITE_PUBLIC_VIEWER_URL=https://viewer.example.test
              VITE_MARKETING_URL=https://www.example.test
          - name: marketing
            dockerfile: apps/marketing-site/Dockerfile
            build_args: |
              MARKETING_URL=https://www.example.test
              MARKETING_APP_URL=https://app.example.test
              MARKETING_API_URL=https://api.example.test
          - name: postgres
            dockerfile: infra/docker/postgres/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ${{ matrix.name }} production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: dpp-ci-${{ matrix.name }}:scan
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ env.DPP_BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DPP_BUILD_CACHE_SCOPE }}
      - name: Scan ${{ matrix.name }} image for fixable high-severity vulnerabilities
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "$RUNNER_TEMP/dpp-trivy.XXXXXX")"
          cleanup() { rm -rf -- "$scan_dir"; }
          trap cleanup EXIT
          # Scan an exported image instead of mounting the runner's Docker
          # socket.  A scanner with that socket is root-equivalent on the CI
          # host, while this temporary tarball is read-only input.
          docker save --output "$scan_dir/image.tar" "dpp-ci-${{ matrix.name }}:scan"
          chmod 0644 "$scan_dir/image.tar"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 1024m \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            -v "$scan_dir:/cache:rw" \
            -e HOME=/cache \
            -e TRIVY_CACHE_DIR=/cache \
            -e TMPDIR=/cache \
            -e TRIVY_NO_PROGRESS=true \
            -e TRIVY_SKIP_VERSION_CHECK=true \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /cache/image.tar --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL
