# This descriptor is installed root-owned at /etc/dpp/dpp-backup-compose.yml.
# It deliberately contains no secret values and is the only Compose descriptor
# used by the systemd-driven database-backup job. Keep it independent of the
# mutable application checkout: the job passes the protected root-only source
# environment file to Compose, which injects only the listed DB-backup values
# into this short-lived, non-root uploader.
services:
  db-backup-uploader:
    image: dpp-backend-api:latest
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=1777
    environment:
      NODE_ENV: production
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_BACKUP_ENABLED: "${DB_BACKUP_ENABLED:?DB_BACKUP_ENABLED is required}"
      DB_BACKUP_S3_ENDPOINT: "${DB_BACKUP_S3_ENDPOINT:?DB_BACKUP_S3_ENDPOINT is required}"
      DB_BACKUP_S3_REGION: "${DB_BACKUP_S3_REGION:?DB_BACKUP_S3_REGION is required}"
      DB_BACKUP_S3_BUCKET: "${DB_BACKUP_S3_BUCKET:?DB_BACKUP_S3_BUCKET is required}"
      DB_BACKUP_S3_ACCESS_KEY_ID: "${DB_BACKUP_S3_ACCESS_KEY_ID:?DB_BACKUP_S3_ACCESS_KEY_ID is required}"
      DB_BACKUP_S3_SECRET_ACCESS_KEY: "${DB_BACKUP_S3_SECRET_ACCESS_KEY:?DB_BACKUP_S3_SECRET_ACCESS_KEY is required}"
      DB_BACKUP_MANIFEST_HMAC_SECRET: "${DB_BACKUP_MANIFEST_HMAC_SECRET:?DB_BACKUP_MANIFEST_HMAC_SECRET is required}"
      DB_BACKUP_S3_FORCE_PATH_STYLE: "${DB_BACKUP_S3_FORCE_PATH_STYLE:?DB_BACKUP_S3_FORCE_PATH_STYLE is required}"
      DB_BACKUP_S3_PREFIX: "${DB_BACKUP_S3_PREFIX:?DB_BACKUP_S3_PREFIX is required}"
      DB_BACKUP_EVIDENCE_S3_PREFIX: "${DB_BACKUP_EVIDENCE_S3_PREFIX:?DB_BACKUP_EVIDENCE_S3_PREFIX is required}"
      DB_BACKUP_MAX_BYTES: "${DB_BACKUP_MAX_BYTES:?DB_BACKUP_MAX_BYTES is required}"
      DB_BACKUP_RETENTION_COUNT: "${DB_BACKUP_RETENTION_COUNT:?DB_BACKUP_RETENTION_COUNT is required}"
    volumes:
      - /var/lib/dpp-db-backups/container:/backup
    networks:
      # The uploader only needs OCI Object Storage egress. Keeping it off the
      # backend application network prevents a backup credential compromise
      # from becoming lateral access to the API or database containers.
      - backup-egress
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # A separate non-internal bridge gives the uploader its own outbound egress.
  # The backup command accepts only HTTPS OCI Object Storage endpoints; no
  # application or database service joins this network.
  backup-egress:
    name: "${COMPOSE_PROJECT_NAME:-dpp}_backup-egress"
    driver: bridge
    internal: false
